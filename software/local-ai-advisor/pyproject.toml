[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectron-local-ai-advisor"
version = "0.1.0"
description = "Small local agricultural recommendation service for SPECTRON AgriAssist"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
inference = [
  "torch>=2.3,<3",
  "transformers>=4.48,<5",
  "accelerate>=1,<2",
  "peft>=0.14,<1",
]
training = [
  "torch>=2.3,<3",
  "transformers>=4.48,<5",
  "accelerate>=1,<2",
  "datasets>=3,<5",
  "peft>=0.14,<1",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]
test = ["pytest>=8,<10"]

[project.scripts]
spectron-local-advisor = "spectron_local_ai.service:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
